framework:
    workflows:
        examination:
            type: state_machine
            marking_store:
                service: app.workflow.marking_store.examination
            supports:
                - App\Entity\Examination
            initial_marking: DRAFT
            places:
                - DRAFT
                - SCHEDULED
                - ONGOING
                - COMPLETED
                - CANCELLED
                - ARCHIVED
            transitions:
                schedule:
                    from: DRAFT
                    to: SCHEDULED
                start:
                    from: SCHEDULED
                    to: ONGOING
                complete:
                    from: ONGOING
                    to: COMPLETED
                archive:
                    from: [DRAFT, SCHEDULED, ONGOING, COMPLETED]
                    to: ARCHIVED
                cancel:
                    from: [DRAFT, SCHEDULED, ONGOING]
                    to: CANCELLED
                reopen:
                    from: COMPLETED
                    to: SCHEDULED
        question_paper:
            type: state_machine
            marking_store:
                service: app.workflow.marking_store.question_paper
            supports:
                - App\Entity\QuestionPaper
            initial_marking: DRAFT
            places:
                - DRAFT
                - REVIEW
                - FINALIZED
                - ARCHIVED
            transitions:
                submit_for_review:
                    from: DRAFT
                    to: REVIEW
                request_changes:
                    from: REVIEW
                    to: DRAFT
                finalize:
                    from: REVIEW
                    to: FINALIZED
                archive:
                    from: [DRAFT, REVIEW, FINALIZED]
                    to: ARCHIVED
        exam_session:
            type: state_machine
            marking_store:
                service: app.workflow.marking_store.exam_session
            supports:
                - App\Entity\ExamSession
            initial_marking: DRAFT
            places:
                - DRAFT
                - SCHEDULED
                - PUBLISHED
                - ACTIVE
                - CLOSED
                - CANCELLED
                - ARCHIVED
            transitions:
                schedule:
                    from: DRAFT
                    to: SCHEDULED
                publish:
                    from: SCHEDULED
                    to: PUBLISHED
                start:
                    from: PUBLISHED
                    to: ACTIVE
                close:
                    from: ACTIVE
                    to: CLOSED
                archive:
                    from: [DRAFT, SCHEDULED, PUBLISHED, ACTIVE, CLOSED]
                    to: ARCHIVED
                cancel:
                    from: [DRAFT, SCHEDULED, PUBLISHED, ACTIVE]
                    to: CANCELLED
                reopen:
                    from: PUBLISHED
                    to: DRAFT
        exam_attempt:
            type: state_machine
            marking_store:
                service: app.workflow.marking_store.exam_attempt
            supports:
                - App\Entity\ExamAttempt
            initial_marking: NOT_STARTED
            places:
                - NOT_STARTED
                - IN_PROGRESS
                - SUBMITTED
                - AUTO_SUBMITTED
                - ABANDONED
            transitions:
                start:
                    from: NOT_STARTED
                    to: IN_PROGRESS
                submit:
                    from: IN_PROGRESS
                    to: SUBMITTED
                auto_submit:
                    from: IN_PROGRESS
                    to: AUTO_SUBMITTED
                abandon:
                    from: IN_PROGRESS
                    to: ABANDONED
