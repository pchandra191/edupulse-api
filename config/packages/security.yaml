security:
    password_hashers:
        App\Entity\User: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        api:
            pattern: ^/api/v1
            stateless: true
            provider: app_user_provider
            jwt: ~

        main:
            lazy: true
            provider: app_user_provider

    access_control:
        - { path: ^/api/v1/auth/login, roles: PUBLIC_ACCESS }
        - { path: ^/api/v1/auth/refresh, roles: PUBLIC_ACCESS }
        - { path: ^/api/v1/auth/forgot-password, roles: PUBLIC_ACCESS }
        - { path: ^/api/v1/auth/reset-password, roles: PUBLIC_ACCESS }
        - { path: ^/api/v1/auth/change-password, roles: PUBLIC_ACCESS }
        - { path: ^/api/v1/users/\d+/reset-password, roles: ROLE_SUPER_ADMIN }
        - { path: ^/api/v1/users/\d+/status, roles: ROLE_INSTITUTE }
        - { path: ^/api/v1/users, roles: [ROLE_SUPER_ADMIN, ROLE_INSTITUTE] }
        - { path: ^/api/v1, roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/, roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            App\Entity\User:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
