security:
    password_hashers:
        App\Entity\User: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        api:
            pattern: ^/api/v1
            stateless: true
            provider: app_user_provider
            jwt: ~

        main:
            lazy: true
            provider: app_user_provider

    access_control:
        - { path: ^/api/v1/auth/login, roles: PUBLIC_ACCESS }
        - { path: ^/api/v1/auth/refresh, roles: PUBLIC_ACCESS }
        - { path: ^/api/v1/auth/forgot-password, roles: PUBLIC_ACCESS }
        - { path: ^/api/v1/auth/reset-password, roles: PUBLIC_ACCESS }
        - { path: ^/api/v1/auth/change-password, roles: PUBLIC_ACCESS }
        - { path: ^/api/v1/roles, roles: ROLE_SUPER_ADMIN }
        - { path: ^/api/v1/permissions, roles: ROLE_SUPER_ADMIN }
        - { path: ^/api/v1/access-control, roles: ROLE_SUPER_ADMIN }
        - { path: ^/api/v1/users/[0-9a-fA-F-]+/permissions, roles: ROLE_SUPER_ADMIN }
        - { path: ^/api/v1/users/\d+/reset-password, roles: ROLE_SUPER_ADMIN }
        - { path: ^/api/v1/users/\d+/status, roles: ROLE_INSTITUTE }
        - { path: ^/api/v1/users/[0-9a-fA-F-]+/(profile|profile-photo|addresses|education|documents), roles: [ROLE_SUPER_ADMIN, ROLE_INSTITUTE, ROLE_TEACHER, ROLE_STUDENT] }
        - { path: ^/api/v1/users/[0-9a-fA-F-]+/(government-identifiers|bank-accounts), roles: [ROLE_SUPER_ADMIN, ROLE_INSTITUTE, ROLE_TEACHER, ROLE_STUDENT] }
        - { path: ^/api/v1/users/[0-9a-fA-F-]+/(addresses|education|documents)/\d+, roles: [ROLE_SUPER_ADMIN, ROLE_INSTITUTE, ROLE_TEACHER, ROLE_STUDENT] }
        - { path: ^/api/v1/users/[0-9a-fA-F-]+/(government-identifiers|bank-accounts)/\d+, roles: [ROLE_SUPER_ADMIN, ROLE_INSTITUTE, ROLE_TEACHER, ROLE_STUDENT] }
        - { path: ^/api/v1/me/(profile|profile-photo|addresses|education|documents), roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/api/v1/me/(government-identifiers|bank-accounts), roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/api/v1/me/(addresses|education|documents)/\d+, roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/api/v1/me/(government-identifiers|bank-accounts)/\d+, roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/api/v1/users, roles: [ROLE_SUPER_ADMIN, ROLE_INSTITUTE] }
        - { path: ^/api/v1, roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/, roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            App\Entity\User:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
